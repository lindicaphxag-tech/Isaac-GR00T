name: SemRepair semantic-runtime gate
description: Install SemRepair from this action checkout, run the proof-carrying runtime gate, and optionally validate an adoption manifest.
author: lindicaphxag-tech

inputs:
  manifest:
    description: Optional path to semrepair-adoption.json in the consumer repository.
    required: false
    default: ""
  repository-root:
    description: Consumer repository root used to validate maintained_path.
    required: false
    default: "."
  model-depth:
    description: Bounded replay-model depth for the runtime release gate.
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - name: Install SemRepair action package
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Run proof-carrying semantic runtime gate
      shell: bash
      run: semrepair-runtime-gate --depth "${{ inputs.model-depth }}" --json

    - name: Validate repository adoption manifest
      if: ${{ inputs.manifest != '' }}
      shell: bash
      run: |
        semrepair-adoption-check           --manifest "${{ inputs.manifest }}"           --repository-root "${{ inputs.repository-root }}"           --json
