[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semrepair"
version = "0.4.0a0"
description = "Semantic type-and-effect compilation with certified repair for embodied-AI pipelines."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "lindicaphxag-tech"}]
keywords = ["embodied-ai", "robotics", "semantic-types", "program-synthesis", "runtime-verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
semrepair-source = "research.semantic_invariants.semrepair_source_cli:main"
semrepair-behavior = "research.semantic_invariants.embodied_behavioral_evidence:main"
semrepair-core-theorems = "research.semantic_invariants.semrepair_core_theorem_check:main"
semrepair-runtime-gate = "research.semantic_invariants.semantic_runtime_release_gate:main"
semrepair-conformance = "research.semantic_invariants.semrepair_compiler_conformance:main"
semrepair-mode-closure = "research.semantic_invariants.semrepair_mode_closure_cli:main"
semrepair-effect-parity = "research.semantic_invariants.semrepair_effect_parity_cli:main"
semrepair-effect-fault-assay = "research.semantic_invariants.semantic_effect_fault_assay:main"
semrepair-adopt-init = "research.semantic_invariants.semrepair_adoption_cli:main"
semrepair-adoption-check = "research.semantic_invariants.semrepair_adoption_check:main"
semrepair-contract-compat = "research.semantic_invariants.semrepair_contract_compatibility:main"
semrepair-repair-lattice = "research.semantic_invariants.semrepair_repair_lattice_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["research*", "semrepair*"]