[project]
name = "casj"
version = "0.1.0"
description = "Counterfactual Action-Support Jacobians for frozen action-chunk repair"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "gymnasium>=1.0", "gym-pusht==0.1.6", "pymunk>=6.6,<7"]
experiment = ["torch>=2.3"]

[tool.pytest.ini_options]
pythonpath = ["."]