name: TEMP validate upstream PR 786

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-pr-786-temp.yml'

permissions:
  contents: read

jobs:
  targeted-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multistep-preserve-truncated-boundary
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "gymnasium==1.2.2" pytest ruff
      - name: Run wrapper boundary regressions
        run: python -m pytest tests/gr00t/eval/sim/wrapper/test_multistep_aggregate.py -q
      - name: Lint changed files
        run: |
          ruff check gr00t/eval/sim/wrapper/multistep_wrapper.py tests/gr00t/eval/sim/wrapper/test_multistep_aggregate.py
          ruff format --check gr00t/eval/sim/wrapper/multistep_wrapper.py tests/gr00t/eval/sim/wrapper/test_multistep_aggregate.py
