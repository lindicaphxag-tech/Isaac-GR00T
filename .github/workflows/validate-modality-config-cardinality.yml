name: Validate modality config cardinality

on:
  push:
    branches:
      - ci/modality-config-cardinality
  workflow_dispatch:

jobs:
  optimized-python-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - name: Run modality config regressions
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/gr00t/data/test_modality_config.py
      - name: Direct optimized-mode witness
        env:
          PYTHONPATH: .
        run: |
          python -O - <<'PY'
          from gr00t.data.types import ActionConfig, ActionFormat, ActionRepresentation, ActionType, ModalityConfig

          try:
              ModalityConfig(
                  delta_indices=[0],
                  modality_keys=["arm", "gripper"],
                  action_configs=[
                      ActionConfig(
                          rep=ActionRepresentation.RELATIVE,
                          type=ActionType.NON_EEF,
                          format=ActionFormat.DEFAULT,
                      )
                  ],
              )
          except ValueError:
              print("PASS: invalid semantic mapping rejected under -O")
          else:
              raise SystemExit("FAIL: invalid semantic mapping accepted under -O")
          PY
