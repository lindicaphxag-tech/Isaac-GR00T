name: Relative EEF Contract

on:
  push:
    branches:
      - test/relative-eef-reference-contract

jobs:
  relative-eef-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal test dependencies
        run: python -m pip install --upgrade numpy scipy pytest
      - name: Run relative EEF reference contract
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/gr00t/data/state_action/test_relative_eef_reference_contract.py
