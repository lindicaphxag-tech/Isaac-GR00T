# casj-trigger-4
name: CASJ public PushT checkpoint gate

on:
  pull_request:
    paths:
      - "casj_validation/**"
      - ".github/workflows/casj-pusht-public-gate.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/casj-pusht-public-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-checkpoint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/casj-pusht-public-gate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Hugging Face checkpoint
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: casj-pusht-diffusion-v1

      - name: Install pinned public-policy stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./casj_validation
          python -m pip install "lerobot[dataset,diffusion,pusht] @ git+https://github.com/huggingface/lerobot.git@8c920c4270460851cedd2737657584586d3dc66f"

      - name: Record dependency versions
        run: |
          python - <<'PY'
          import importlib.metadata as md
          for package in ["lerobot", "gym-pusht", "gymnasium", "pymunk", "torch"]:
              print(package, md.version(package))
          PY

      - name: Run public checkpoint end-to-end smoke
        run: |
          mkdir -p casj_evidence
          python casj_validation/experiments/public_pusht_gate.py             --device cpu             --num-inference-steps 2             --warmup-steps 0             --replicates 1             --heldout-pose 10 -6 0.35             --output casj_evidence/pusht_public_smoke.json

      - name: Validate evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("casj_evidence/pusht_public_smoke.json")
          report = json.loads(path.read_text())
          assert report["model_id"] == "lerobot/diffusion_pusht"
          assert report["dataset_id"] == "lerobot/pusht"
          assert report["effective_num_inference_steps"] == 2
          assert report["uses_checkpoint_default_inference_steps"] is False
          assert report["snapshots"]
          for result in report["snapshots"].values():
              assert result["assay_status"] == "VALID_INPUT_PERTURBATION"
              assert result["paired_randomness_replay_error"] <= 1e-6
          print(json.dumps(report["summary"], indent=2, sort_keys=True))
          PY

      - name: Upload public-checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: casj-pusht-public-checkpoint-smoke
          path: casj_evidence/pusht_public_smoke.json
          if-no-files-found: error
          retention-days: 90