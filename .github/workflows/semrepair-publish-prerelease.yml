name: Publish SemRepair 0.3.0rc1 prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - semrepair-v0.3-rc1
    paths:
      - ".github/workflows/semrepair-publish-prerelease.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: semrepair-v0.3.0rc1
      RELEASE_TARGET: 8cd7e7ad01e50aa18f42d333765f4fd242228d66
      VALIDATED_TARGET: 77bd90c36360cdca9d43447789cccb137d2b6708
      VALIDATION_RUN: "37318890379"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect existing release and tag
        id: existing
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-remote --tags "https://github.com/${{ github.repository }}.git"               "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify immutable validation run succeeded
        run: |
          conclusion="$(gh api "repos/${{ github.repository }}/actions/runs/$VALIDATION_RUN" --jq .conclusion)"
          head_sha="$(gh api "repos/${{ github.repository }}/actions/runs/$VALIDATION_RUN" --jq .head_sha)"
          test "$conclusion" = "success"
          test "$head_sha" = "$VALIDATED_TARGET"

      - name: Checkout frozen release target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify snapshot content matches validated target
        run: |
          git fetch origin semrepair-v0.3-rc1
          git diff --exit-code "$VALIDATED_TARGET" "$RELEASE_TARGET" -- semrepair_validation LICENSE

      - name: Rebuild distribution from frozen target
        run: |
          python -m pip install --upgrade pip build
          python -m build semrepair_validation
          python -m pip install semrepair_validation/dist/*.whl
          python - <<'PY'
          import semrepair
          assert semrepair.__version__ == "0.3.0rc1"
          print(semrepair.__version__)
          PY

      - name: Create prerelease through GitHub REST
        if: steps.existing.outputs.release_exists != 'true'
        id: create_release
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release-diagnostics
          jq -n             --arg tag "$RELEASE_TAG"             --arg target "$RELEASE_TARGET"             --arg name "SemRepair 0.3.0rc1 — Proof-Carrying Semantic Runtime"             --rawfile body semrepair_validation/RELEASE_NOTES_0_3_0_RC1.md             '{
              tag_name: $tag,
              target_commitish: $target,
              name: $name,
              body: $body,
              draft: false,
              prerelease: true,
              generate_release_notes: false
            }' > release-diagnostics/request.json

          status="$(curl -sS             -o release-diagnostics/response.json             -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPOSITORY/releases"             -d @release-diagnostics/request.json)"

          echo "$status" > release-diagnostics/http-status.txt
          cat release-diagnostics/response.json

          if [ "$status" != "201" ]; then
            echo "GitHub release creation failed with HTTP $status"
            jq -n               --arg status "$status"               --rawfile response release-diagnostics/response.json               --arg run "${{ github.run_id }}"               '{http_status:$status,response:$response,workflow_run:$run}'               > release-diagnostics/RELEASE_PUBLISH_DIAGNOSTIC.json

            if [ "$status" = "403" ]; then
              echo "Release API is blocked; creating an immutable annotated tag fallback."
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$RELEASE_TAG" "$RELEASE_TARGET" -m "SemRepair 0.3.0rc1 — Proof-Carrying Semantic Runtime"
              git push origin "refs/tags/$RELEASE_TAG"
              echo "tag_fallback=true" >> "$GITHUB_OUTPUT"
              echo "release_id=" >> "$GITHUB_OUTPUT"
              echo "html_url=https://github.com/${{ github.repository }}/tree/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            exit 1
          fi

          release_id="$(jq -r .id release-diagnostics/response.json)"
          upload_url="$(jq -r .upload_url release-diagnostics/response.json | sed 's/{?name,label}//')"
          html_url="$(jq -r .html_url release-diagnostics/response.json)"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "upload_url=$upload_url" >> "$GITHUB_OUTPUT"
          echo "html_url=$html_url" >> "$GITHUB_OUTPUT"

      - name: Upload wheel and sdist to prerelease
        if: steps.create_release.outputs.release_id != ''
        run: |
          gh release upload "$RELEASE_TAG"             semrepair_validation/dist/*             --repo "${{ github.repository }}"             --clobber

      - name: Publish distribution artifacts for tag fallback
        if: steps.create_release.outputs.tag_fallback == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: semrepair-0.3.0rc1-distributions
          path: semrepair_validation/dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Validate published wheel and immutable tag
        run: |
          python -m pip uninstall -y semrepair || true
          python -m pip install "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/semrepair-0.3.0rc1-py3-none-any.whl"
          python - <<'PY'
          import semrepair
          assert semrepair.__version__ == "0.3.0rc1"
          print("published-wheel", semrepair.__version__)
          PY
          semrepair-core-theorem-check --json > /tmp/published-wheel-theorem.json
          semrepair-compiler-conformance --json > /tmp/published-wheel-conformance.json

          python -m pip uninstall -y semrepair
          python -m pip install "git+https://github.com/${{ github.repository }}.git@$RELEASE_TAG#subdirectory=semrepair_validation"
          python - <<'PY'
          import semrepair
          assert semrepair.__version__ == "0.3.0rc1"
          print("public-tag", semrepair.__version__)
          PY
          semrepair-core-theorem-check --json > /tmp/public-tag-theorem.json
          semrepair-compiler-conformance --json > /tmp/public-tag-conformance.json

      - name: Persist release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semrepair-release-publish-diagnostics
          path: release-diagnostics/
          if-no-files-found: warn
          retention-days: 30