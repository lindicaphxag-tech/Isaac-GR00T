# clean-head-v1
name: Validate GR00T PR 786 boundary semantics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-gr00t-786.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multistep-preserve-truncated-boundary

      - name: Resolve exact PR head
        id: prhead
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest gymnasium==1.2.2 numpy==1.26.4 ruff filelock

      - name: Run MultiStepWrapper boundary regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/gr00t/eval/sim/wrapper/test_multistep_aggregate.py

      - name: Check touched files
        run: |
          ruff check gr00t/eval/sim/wrapper/multistep_wrapper.py tests/gr00t/eval/sim/wrapper/test_multistep_aggregate.py
          ruff format --check gr00t/eval/sim/wrapper/multistep_wrapper.py tests/gr00t/eval/sim/wrapper/test_multistep_aggregate.py

      - name: Publish PR-head commit status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ steps.prhead.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["PR_HEAD"]
          url = f"https://api.github.com/repos/{repo}/statuses/{sha}"
          payload = json.dumps(
              {
                  "state": "success",
                  "target_url": os.environ["RUN_URL"],
                  "description": "boundary regressions + touched-file lint passed",
                  "context": "fork/gr00t-786-validation",
              }
          ).encode()
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              print(response.read().decode())
          PY
