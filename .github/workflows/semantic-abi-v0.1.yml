name: Semantic ABI artifact v0.1

on:
  push:
    branches:
      - artifact/semantic-abi-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-design:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependency-light test runtime
        run: python -m pip install --upgrade pip pytest

      - name: Prove mirrored kernel identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object validation_semrepair/embodied_semantic_experiment_design.py)" = "ae46b4da05e9ab07c4ee2fd178a750ecbbff26f5"
          test "$(git hash-object validation_semrepair/embodied_semantic_identification_repair.py)" = "a7743d24196ea8d266832983b04d4d9b2679a54c"
          test "$(git hash-object validation_semrepair/embodied_semantic_probe_synthesis.py)" = "0a30f3abd189c2fad1fc84cfca6eef9487f80ae8"
          test "$(git hash-object validation_semrepair/embodied_semantic_repair_aware_design.py)" = "3c264fa34ea92a79e889e6a5f3ff0059b80079cd"

      - name: Compile validation kernel
        run: python -m compileall -q validation_semrepair

      - name: Run two-minute machine-readable reproduction
        run: |
          python -m validation_semrepair.quick_repro | tee quick_repro.json
          python -m json.tool quick_repro.json

      - name: Run exact design, observability, and repair-authority tests
        run: |
          python -m pytest -q             validation_semrepair/tests/test_embodied_semantic_experiment_design.py             validation_semrepair/tests/test_embodied_semantic_identification_repair.py             validation_semrepair/tests/test_embodied_semantic_repair_aware_design.py             validation_semrepair/tests/test_embodied_semantic_probe_synthesis.py             validation_semrepair/tests/test_embodied_semantic_observability.py             validation_semrepair/tests/test_embodied_semantic_transport.py

  authority-formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject proof holes
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '\b(sorry|admit)\b' --include='*.lean' semrepair_validation/formal; then
            echo "formal source contains sorry/admit"
            exit 1
          fi

      - name: Build Lean authority theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: semrepair_validation/formal
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
