name: SemRepair standalone CI

on:
  push:
    branches:
      - semrepair-standalone-v0.3.0rc1
      - semrepair-standalone-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install standalone package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip check
      - name: Run full standalone tests
        run: python -m pytest -q tests
      - name: Run evidence CLIs
        run: |
          semrepair-behavior --json
          semrepair-core-theorems --json
          semrepair-conformance --json
          semrepair-runtime-gate --depth 4 --json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist from standalone root
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          python -m pip check
          semrepair-core-theorems --json
          semrepair-conformance --json

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          cd formal
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
          lean --version
          lake --version
      - name: Reject incomplete proofs
        run: |
          if grep -R -nE '\b(sorry|admit)\b' formal/SemRepairFormal; then
            echo "Incomplete proof placeholder found"
            exit 1
          fi
      - name: Build formal core
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd formal
          lake update
          lake build

  native-mujoco-masking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone SemRepair and native MuJoCo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . mujoco numpy
      - name: Run exact complete-masking physical assay
        run: python examples/native_mujoco_complete_masking.py
