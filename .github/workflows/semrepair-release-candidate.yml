name: SemRepair v0.3 release candidate

on:
  push:
    branches:
      - semrepair-v0.3-rc2
    paths:
      - "semrepair_validation/**"
      - ".github/workflows/semrepair-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest build
      - name: Install SemRepair release candidate
        run: python -m pip install -e semrepair_validation
      - name: Run public test surface
        run: python -m pytest -q semrepair_validation/tests
      - name: Create evidence directory
        run: mkdir -p semrepair_validation/artifacts
      - name: Run source-to-compiler example
        run: |
          set -o pipefail
          semrepair-source \
            --manifest semrepair_validation/examples/maniskill_style/semrepair.json \
            --json | tee semrepair_validation/artifacts/source-example.json
      - name: Emit behavioral evidence
        run: |
          set -o pipefail
          semrepair-behavior --json | tee semrepair_validation/artifacts/behavioral-evidence.json
      - name: Run bounded theorem checks
        run: |
          set -o pipefail
          semrepair-core-theorems --json | tee semrepair_validation/artifacts/core-theorems.json
      - name: Run production compiler conformance
        run: |
          set -o pipefail
          semrepair-conformance --json | tee semrepair_validation/artifacts/compiler-conformance.json
      - name: Run proof-carrying runtime release gate
        run: |
          set -o pipefail
          semrepair-runtime-gate --depth 4 --json | tee semrepair_validation/artifacts/runtime-release-gate.json
      - name: Run physical-effect fault injection assay
        run: |
          set -o pipefail
          semrepair-effect-fault-assay --json | tee semrepair_validation/artifacts/physical-effect-fault-assay.json
      - name: Build wheel and sdist
        run: python -m build semrepair_validation
      - name: Check installed dependencies
        run: python -m pip check
      - name: Upload release-candidate artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: semrepair-0.3.0rc2
          path: |
            semrepair_validation/dist/*
            semrepair_validation/artifacts/*.json
            semrepair_validation/RELEASE_STATUS.json
            semrepair_validation/CITATION.cff
            semrepair_validation/LICENSE
          if-no-files-found: error
          retention-days: 30

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          cd semrepair_validation/formal
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
          lean --version
      - name: Reject incomplete proofs
        run: |
          if grep -R -nE '\b(sorry|admit)\b' semrepair_validation/formal/SemRepairFormal; then
            echo "Incomplete proof placeholder found"
            exit 1
          fi
      - name: Build formal core
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd semrepair_validation/formal
          lake update
          lake build

  external-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from public Git URL
        run: |
          python -m pip install --upgrade pip
          python -m pip install             "git+https://github.com/lindicaphxag-tech/Isaac-GR00T.git@semrepair-v0.3-rc2#subdirectory=semrepair_validation"
      - name: Verify public import and version
        run: |
          python - <<'PY'
          import semrepair
          assert semrepair.__version__ == "0.3.0rc2"
          print(semrepair.__version__)
          PY

      - name: Verify packaged proof-bundle schema
        run: |
          python - <<'PY'
          from importlib.resources import files
          import json
          path = files("research.semantic_invariants").joinpath(
              "semrepair_execution_proof_bundle_v0_1.schema.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["title"] == "SemRepair execution proof bundle v0.1"
          print(path)
          PY

      - name: Generate and independently verify installed proof bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.semantic_invariants.embodied_compilation_certificate import (
              issue_compilation_certificate,
          )
          from research.semantic_invariants.embodied_semantic_compiler import (
              compile_semantic_boundary,
          )
          from research.semantic_invariants.embodied_semantic_types import (
              SemanticAdapter,
              SemanticTensorType,
          )
          from research.semantic_invariants.execution_bundle_wire import (
              export_execution_bundle,
          )
          from research.semantic_invariants.semantic_effect_certificate import (
              EffectCommitPolicy,
              issue_effect_certificate,
          )
          from research.semantic_invariants.semantic_effect_commit import (
              EffectClass,
              SemanticEffectIntent,
          )

          source = SemanticTensorType(
              role="action",
              entity="ee_rotation_delta",
              representation="axis_angle",
              unit="rad",
              provenance="requested",
          )
          target = source.updated(representation="euler_xyz")
          adapter = SemanticAdapter(
              "axis-to-euler",
              requires={"representation": "axis_angle"},
              produces={"representation": "euler_xyz"},
              cost=1.0,
          )
          result = compile_semantic_boundary(source, target, adapters=(adapter,))
          compilation = issue_compilation_certificate(result, adapters=(adapter,))
          intent = SemanticEffectIntent(
              effect_id="external-consumer:handoff",
              action_name="handoff",
              effect_class=EffectClass.IRREVERSIBLE,
              dependency_version=compilation.decision_digest,
              precondition=lambda state: state["holder"] == "robot",
              postcondition=lambda state: state["holder"] == "human",
          )
          effect = issue_effect_certificate(
              intent,
              policy=EffectCommitPolicy(min_commit_planes=2),
              semantic_contract_id="embodied/effect/handoff@0.1",
          )
          bundle = export_execution_bundle(
              compilation,
              effect,
              intent,
              semantic_contract_id="embodied/effect/handoff@0.1",
              adapters=(adapter,),
              max_steps=4,
          )
          Path("/tmp/semrepair-proof-bundle.json").write_text(
              json.dumps(bundle, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          semrepair-proof-bundle             --input /tmp/semrepair-proof-bundle.json             --json | tee /tmp/semrepair-proof-bundle-report.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/semrepair-proof-bundle-report.json"))
          assert report["valid"] is True
          assert all(report["checks"].values())
          PY
      - name: Run installed theorem checker
        run: semrepair-core-theorems --json
      - name: Run installed production conformance
        run: semrepair-conformance --json
      - name: Run installed runtime release gate
        run: semrepair-runtime-gate --depth 4 --json
      - name: Run installed physical-effect fault assay
        run: semrepair-effect-fault-assay --json
      - name: Run installed behavioral evidence
        run: semrepair-behavior --json
      - name: Verify installed contract compatibility CLI
        run: semrepair-contract-compat --help
      - name: Run installed proof-bundle verifier help
        run: semrepair-proof-bundle --help

      - name: Exercise external adoption scaffold
        run: |
          rm -rf /tmp/semrepair-adoption
          semrepair-adopt-init \
            --repository example/robot-stack \
            --contract-id embodied/representation/controller-roundtrip@0.2 \
            --semantic-layer controller/action-representation \
            --integration-type native-regression \
            --maintained-path test_semantic_contract.py \
            --output-dir /tmp/semrepair-adoption
          semrepair-adoption-check \
            --manifest /tmp/semrepair-adoption/semrepair-adoption.json \
            --repository-root /tmp/semrepair-adoption \
            --json
          grep -q NotImplementedError /tmp/semrepair-adoption/test_semantic_contract.py

  real-source-maniskill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SemRepair release candidate
        uses: actions/checkout@v4
        with:
          path: semrepair-host
      - name: Checkout pinned ManiSkill source
        uses: actions/checkout@v4
        with:
          repository: mani-skill/ManiSkill
          ref: 62ff3a5896b4d5b4cf0ac4c8d79afe600c9404a3
          path: upstream-maniskill
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SemRepair
        run: python -m pip install -e semrepair-host/semrepair_validation
      - name: Compile real ManiSkill producer-consumer boundary
        run: |
          set -o pipefail
          mkdir -p evidence
          semrepair-source \
            --manifest semrepair-host/semrepair_validation/examples/real_source/maniskill_1138.json \
            --source-root upstream-maniskill \
            --json | tee evidence/maniskill-1138-source-audit.json
      - name: Upload real-source evidence
        uses: actions/upload-artifact@v4
        with:
          name: semrepair-maniskill-1138-real-source
          path: evidence/maniskill-1138-source-audit.json
          if-no-files-found: error
          retention-days: 30

  native-maniskill-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SemRepair release candidate
        uses: actions/checkout@v4
        with:
          path: semrepair-host
      - name: Checkout pinned ManiSkill source
        uses: actions/checkout@v4
        with:
          repository: mani-skill/ManiSkill
          ref: 62ff3a5896b4d5b4cf0ac4c8d79afe600c9404a3
          path: upstream-maniskill
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and frozen ManiSkill
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e upstream-maniskill
      - name: Execute current production converter-controller boundary
        env:
          PYTHONPATH: upstream-maniskill
        run: |
          set -o pipefail
          mkdir -p evidence
          python semrepair-host/semrepair_validation/examples/real_source/maniskill_native_boundary.py \
            --expect current-broken --json \
            | tee evidence/maniskill-1138-native-before.json

      - name: Apply exact minimal converter patch
        run: |
          git -C upstream-maniskill apply --check \
            ../semrepair-host/semrepair_validation/examples/real_source/maniskill_1138_converter.patch
          git -C upstream-maniskill apply \
            ../semrepair-host/semrepair_validation/examples/real_source/maniskill_1138_converter.patch
          git -C upstream-maniskill diff --check

      - name: Execute patched production converter-controller boundary
        env:
          PYTHONPATH: upstream-maniskill
        run: |
          set -o pipefail
          python semrepair-host/semrepair_validation/examples/real_source/maniskill_native_boundary.py \
            --expect patched-green --json \
            | tee evidence/maniskill-1138-native-after.json

      - name: Upload native ManiSkill red-green evidence
        uses: actions/upload-artifact@v4
        with:
          name: semrepair-maniskill-1138-native-boundary
          path: |
            evidence/maniskill-1138-native-before.json
            evidence/maniskill-1138-native-after.json
          if-no-files-found: error
          retention-days: 30

  real-source-groot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SemRepair release candidate
        uses: actions/checkout@v4
        with:
          path: semrepair-host
      - name: Checkout pinned upstream GR00T source
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/Isaac-GR00T
          ref: 51d4c89f72fda44cbf77285c6a8114b52676b8a1
          path: upstream-groot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SemRepair
        run: python -m pip install -e semrepair-host/semrepair_validation
      - name: Infer real GR00T ActionRepresentation closure
        run: |
          set -o pipefail
          mkdir -p evidence
          semrepair-mode-closure \
            --enum-source upstream-groot/gr00t/data/types.py \
            --runtime-source upstream-groot/gr00t/data/state_action/state_action_processor.py \
            --enum-name ActionRepresentation \
            --default ABSOLUTE \
            --json | tee evidence/groot-action-representation-closure.json
      - name: Assert frozen source relation
        run: |
          python - <<'PY'
          import json
          report = json.load(open("evidence/groot-action-representation-closure.json"))
          assert report["declared"] == ["ABSOLUTE", "DELTA", "RELATIVE"]
          assert report["handled"] == ["RELATIVE"]
          assert report["explicit_default"] == ["ABSOLUTE"]
          assert report["unresolved"] == ["DELTA"]
          assert report["closed"] is False
          PY
      - name: Upload GR00T real-source evidence
        uses: actions/upload-artifact@v4
        with:
          name: semrepair-groot-real-source
          path: evidence/groot-action-representation-closure.json
          if-no-files-found: error
          retention-days: 30

  real-source-lerobot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SemRepair release candidate
        uses: actions/checkout@v4
        with:
          path: semrepair-host
      - name: Checkout pinned LeRobot source
        uses: actions/checkout@v4
        with:
          repository: huggingface/lerobot
          ref: 8c920c4270460851cedd2737657584586d3dc66f
          path: upstream-lerobot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SemRepair
        run: python -m pip install -e semrepair-host/semrepair_validation
      - name: Compare sync and async source-effect signatures
        run: |
          set -o pipefail
          mkdir -p evidence
          semrepair-effect-parity \
            --reference-source upstream-lerobot/src/lerobot/rollout/inference/sync.py \
            --reference-source upstream-lerobot/src/lerobot/policies/utils.py \
            --alternative-source upstream-lerobot/src/lerobot/async_inference/policy_server.py \
            --alternative-source upstream-lerobot/src/lerobot/async_inference/helpers.py \
            --json | tee evidence/lerobot-sync-async-effect-parity.json
      - name: Assert frozen effect asymmetry without defect overclaim
        run: |
          python - <<'PY'
          import json
          report = json.load(open("evidence/lerobot-sync-async-effect-parity.json"))
          assert "policy_preprocess" in report["shared_effects"]
          assert report["reference_only"] == []
          assert report["alternative_only"] == ["image_resize_to_policy_shape"]
          assert report["symmetric"] is False
          assert "before classifying a defect" in report["claim_boundary"]
          PY
      - name: Upload LeRobot real-source evidence
        uses: actions/upload-artifact@v4
        with:
          name: semrepair-lerobot-real-source
          path: evidence/lerobot-sync-async-effect-parity.json
          if-no-files-found: error
          retention-days: 30

  native-sim-mujoco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SemRepair release candidate
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SemRepair and pinned MuJoCo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e semrepair_validation
          python -m pip install "mujoco==3.14.0"
      - name: Run native MuJoCo closed-loop semantic corruption and repair
        run: |
          set -o pipefail
          mkdir -p evidence
          python semrepair_validation/examples/mujoco_native/mujoco_semrepair_closed_loop.py \
            --json | tee evidence/mujoco-native-closed-loop.json
      - name: Upload native MuJoCo evidence
        uses: actions/upload-artifact@v4
        with:
          name: semrepair-mujoco-native-closed-loop
          path: evidence/mujoco-native-closed-loop.json
          if-no-files-found: error
          retention-days: 30

  reusable-action-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SemRepair action
        uses: actions/checkout@v4

      - name: Create simulated downstream adoption surface
        run: |
          mkdir -p consumer-fixture/tests
          cat > consumer-fixture/tests/test_semantic_contract.py <<'PY'
          def test_repository_native_semantic_contract():
              assert True
          PY
          cat > consumer-fixture/semrepair-adoption.json <<'JSON'
          {
            "schema_version": 1,
            "repository": "example/robot-stack",
            "integration_type": "native-regression",
            "semantic_layer": "controller/action-representation",
            "contract_ids": [
              "embodied/representation/controller-roundtrip@0.2"
            ],
            "maintained_path": "tests/test_semantic_contract.py",
            "status": "candidate",
            "claim_boundary": "CI fixture only; not external adoption."
          }
          JSON

      - name: Consume reusable SemRepair Action
        uses: ./semrepair_validation
        with:
          manifest: consumer-fixture/semrepair-adoption.json
          repository-root: consumer-fixture
          model-depth: "3"