name: Nuisance-robust semantic identifiability

on:
  push:
    branches:
      - validation/nuisance-robust-semantic-identifiability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Assert exact research-kernel identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/validation/nuisance_semantic.py)" = "33f6d5f5d38cfa188819ce301906f97acf915b4a"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint
        run: ruff check .github/validation/nuisance_semantic.py .github/validation/test_nuisance_semantic.py

      - name: Run nuisance-identifiability mechanisms
        env:
          PYTHONPATH: .github/validation
        run: python -m pytest -q .github/validation/test_nuisance_semantic.py
