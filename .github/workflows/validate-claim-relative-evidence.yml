name: Claim-relative semantic evidence

on:
  push:
    branches:
      - validation/claim-relative-evidence-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-authority:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint claim-authority surface
        run: |
          ruff check             .github/validation/claim_relative_evidence/planner.py             .github/validation/claim_relative_evidence/test_planner.py             .github/validation/claim_relative_evidence/maniskill_claim_authority_case.py

      - name: Run claim-authority tests
        working-directory: .github/validation/claim_relative_evidence
        run: python -m pytest -q test_planner.py

      - name: Emit real ManiSkill claim routing
        working-directory: .github/validation/claim_relative_evidence
        run: python maniskill_claim_authority_case.py
