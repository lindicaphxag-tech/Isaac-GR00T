name: SemRepair compatibility surface

on:
  push:
    branches:
      - semrepair-v0.3-rc1
    paths:
      - "semrepair_validation/research/semantic_invariants/semrepair_contract_compatibility.py"
      - "semrepair_validation/tests/test_semrepair_contract_compatibility.py"
      - "semrepair_validation/CONTRACT_COMPATIBILITY.md"
      - "semrepair_validation/pyproject.toml"
      - ".github/workflows/semrepair-compatibility.yml"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public package
        run: python -m pip install ./semrepair_validation
      - name: Run compatibility tests
        run: python -m pytest -q semrepair_validation/tests/test_semrepair_contract_compatibility.py
      - name: Verify CLI is installed
        run: semrepair-contract-compat --help
