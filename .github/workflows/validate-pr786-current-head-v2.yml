name: Validate PR 786 current-head boundary semantics

on:
  push:
    branches:
      - validation/pr786-current-head-v2
  pull_request:
    branches:
      - validation/pr786-current-head-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-boundary-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert production diff is exact PR #786 head
        run: |
          git diff --exit-code 5486a86a08c5c69f3ced44ac44a02272e7e874e2 HEAD --             gr00t/eval/sim/wrapper/multistep_wrapper.py             tests/gr00t/eval/sim/wrapper/test_multistep_aggregate.py

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependency-light runtime requirements
        run: python -m pip install --upgrade pip numpy gymnasium

      - name: Validate production MultiStep boundary semantics
        run: PYTHONPATH=. python .github/validation/validate_multistep_boundary_v2.py
