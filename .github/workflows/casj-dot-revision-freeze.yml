name: CASJ DOT Revision Freeze

on:
  push:
    branches:
      - "validation/casj-dot-public-gate"
    paths:
      - ".github/workflows/casj-dot-revision-freeze.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/casj-dot-public-gate
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve immutable public revisions only
        run: |
          python -m pip install -q "huggingface_hub>=0.28"
          mkdir -p evidence/casj
          python - <<'PY'
          import json
          from pathlib import Path
          from huggingface_hub import HfApi

          api = HfApi()
          model_id = "IliaLarchenko/dot_pusht_keypoints_best"
          dataset_id = "lerobot/pusht_keypoints"
          dot_source_repo = "IliaLarchenko/lerobot"
          dot_source_revision = "42cca283322bbb68b6d3f1b4a436ada5b5d3393a"

          model = api.model_info(model_id, revision="main", files_metadata=True)
          dataset = api.dataset_info(dataset_id, revision="main", files_metadata=True)

          model_files = sorted(s.rfilename for s in model.siblings)
          dataset_files = sorted(s.rfilename for s in dataset.siblings)

          required_model = {"config.json", "model.safetensors"}
          missing_model = sorted(required_model - set(model_files))
          if missing_model:
              raise SystemExit(f"missing required model files: {missing_model}")

          if not any(name.endswith(".parquet") for name in dataset_files):
              raise SystemExit("dataset revision has no parquet payload")

          payload = {
              "schema_version": 1,
              "purpose": "revision-discovery-only; no CASJ method output is computed",
              "model_id": model_id,
              "model_revision": model.sha,
              "model_files": model_files,
              "dataset_id": dataset_id,
              "dataset_revision": dataset.sha,
              "dataset_files": dataset_files,
              "dot_source_repo": dot_source_repo,
              "dot_source_revision": dot_source_revision,
              "method_results_observed": False,
          }
          out = Path("evidence/casj/dot_revision_freeze.json")
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Commit immutable revision freeze
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/casj/dot_revision_freeze.json
          if git diff --cached --quiet; then
            echo "revision freeze already current"
            exit 0
          fi
          git commit -m "evidence: freeze DOT public checkpoint revisions"
          git push origin HEAD:validation/casj-dot-public-gate
