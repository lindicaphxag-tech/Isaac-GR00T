name: Native MuJoCo semantic fault masking

on:
  push:
    branches:
      - validation/semantic-fault-masking-mujoco
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind experiment to public rc1 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8cd7e7ad01e50aa18f42d333765f4fd242228d66 HEAD
          test -f semrepair_validation/pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native MuJoCo dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mujoco>=3.2,<4"

      - name: Run 2x2 physical fault-interaction assay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=semrepair_validation \
            python semrepair_validation/examples/mujoco_native/semantic_fault_masking_factorial.py --json \
            | tee semantic_fault_masking_report.json

      - name: Validate semantic evidence payload
        shell: bash
        run: |
          set -euo pipefail
          test -s semantic_fault_masking_report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("semantic_fault_masking_report.json").read_text())
          static = report["static_prediction"]
          lattice = report["repair_lattice"]
          assert static["structurally_masked"] is True
          assert static["net_is_identity"] is True
          assert lattice["single_repair_paradox"] is True
          assert lattice["behavioral_masking"] is True
          assert lattice["producer_repair_only"] > lattice["baseline_both_faults"] + 0.25
          assert lattice["dispatch_repair_only"] > lattice["baseline_both_faults"] + 0.25
          assert lattice["both_repairs"] < 0.02
          print(json.dumps(lattice, sort_keys=True))
          PY

      - name: Publish deterministic evidence digest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum semantic_fault_masking_report.json | tee semantic_fault_masking_report.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: semantic-fault-masking-mujoco
          path: |
            semantic_fault_masking_report.json
            semantic_fault_masking_report.sha256
          if-no-files-found: error
