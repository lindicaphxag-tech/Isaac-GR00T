name: Public SemRepair interaction kernel

on:
  push:
    branches:
      - validation/semrepair-interaction-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantics:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - name: Compile validation kernel
        run: python -m compileall -q validation_semrepair
      - name: Run semantic interaction tests
        run: |
          python -m pytest -q \
            validation_semrepair/tests/test_embodied_repair_interactions.py \
            validation_semrepair/tests/test_embodied_atomic_repair.py \
            validation_semrepair/tests/test_embodied_semantic_transport.py \
            validation_semrepair/tests/test_embodied_semantic_observability.py
