name: Validate MultiStep boundary semantics

on:
  push:
    branches:
      - validation/pr786-current-head
  workflow_dispatch:

jobs:
  focused-boundary-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependency-light runtime requirements
        run: python -m pip install --upgrade pip numpy gymnasium
      - name: Validate production MultiStep boundary semantics
        run: PYTHONPATH=. python .github/validation/validate_multistep_boundary.py