name: Format PR 786 touched files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-pr786-touched.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multistep-preserve-truncated-boundary
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format only PR 786 touched Python files
        run: |
          python -m pip install ruff==0.16.10
          ruff format             gr00t/eval/sim/wrapper/multistep_wrapper.py             tests/gr00t/eval/sim/wrapper/test_multistep_aggregate.py
          ruff check             gr00t/eval/sim/wrapper/multistep_wrapper.py             tests/gr00t/eval/sim/wrapper/test_multistep_aggregate.py

      - name: Commit pure formatting change if needed
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             gr00t/eval/sim/wrapper/multistep_wrapper.py             tests/gr00t/eval/sim/wrapper/test_multistep_aggregate.py
          git commit -m "Format PR 786 touched files"
          git push origin HEAD:fix/multistep-preserve-truncated-boundary
