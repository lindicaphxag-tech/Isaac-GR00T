name: Safe semantic experiment planner

on:
  push:
    branches:
      - validation/safe-semantic-experiment-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-planner:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint planner and tests
        run: |
          ruff check             .github/validation/safe_semantic_experiment/planner.py             .github/validation/safe_semantic_experiment/test_planner.py

      - name: Run exact safe experiment synthesis tests
        working-directory: .github/validation/safe_semantic_experiment
        run: python -m pytest -q test_planner.py
