name: Validate unsupported DELTA rejection

on:
  push:
    branches:
      - ci/reject-delta-action-representation
  workflow_dispatch:

jobs:
  delta-representation-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install numpy
      - name: DELTA must fail closed while RELATIVE and ABSOLUTE remain valid
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from gr00t.data.types import ActionConfig, ActionFormat, ActionRepresentation, ActionType, ModalityConfig

          def make(rep):
              return ModalityConfig(
                  delta_indices=[0],
                  modality_keys=["arm"],
                  action_configs=[
                      ActionConfig(
                          rep=rep,
                          type=ActionType.NON_EEF,
                          format=ActionFormat.DEFAULT,
                      )
                  ],
              )

          for supported in (ActionRepresentation.RELATIVE, ActionRepresentation.ABSOLUTE):
              make(supported)

          try:
              make(ActionRepresentation.DELTA)
          except ValueError as exc:
              assert "DELTA is not implemented" in str(exc)
              print("PASS: DELTA fails closed; supported representations remain valid")
          else:
              raise SystemExit("FAIL: DELTA was silently accepted")
          PY
