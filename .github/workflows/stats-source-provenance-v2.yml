name: Stats source provenance v2

on:
  push:
    branches:
      - fix/stats-cache-source-provenance-v2

env:
  PYTHONPATH: ./

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Pull LFS objects
        run: git lfs pull
      - name: Setup Python environment
        uses: ./.github/actions/setup-venv
        with:
          python-version: "3.12"
          cache-prefix: stats-source-provenance-v2
      - name: Install targeted test dependencies
        run: |
          . .venv/bin/activate
          pip install pytest filelock numpy==1.26.4 pandas==2.2.3 scipy==1.15.3 tqdm
      - name: Lint touched files
        run: |
          . .venv/bin/activate
          ruff check gr00t/data/stats.py tests/gr00t/data/test_generate_stats_cache_fingerprint.py tests/gr00t/data/test_stats_cache_fingerprint.py
          ruff format --check gr00t/data/stats.py tests/gr00t/data/test_generate_stats_cache_fingerprint.py tests/gr00t/data/test_stats_cache_fingerprint.py
      - name: Run source provenance regressions
        run: |
          . .venv/bin/activate
          python -m pytest tests/gr00t/data/test_generate_stats_cache_fingerprint.py tests/gr00t/data/test_stats_cache_fingerprint.py -q
