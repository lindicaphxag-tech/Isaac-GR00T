name: SemRepair authority hardening public gate

on:
  push:
    branches:
      - "validation/semrepair-authority-hardening"
    paths:
      - "research/semantic_invariants/**"
      - ".github/workflows/semrepair-authority-hardening.yml"
  pull_request:
    paths:
      - "research/semantic_invariants/**"
      - ".github/workflows/semrepair-authority-hardening.yml"

jobs:
  authority:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile mirrored production modules
        run: |
          python -m py_compile \
            research/semantic_invariants/embodied_repair_synthesis.py \
            research/semantic_invariants/embodied_repair_verification.py \
            research/semantic_invariants/embodied_repair_runtime.py \
            research/semantic_invariants/embodied_repair_interactions.py \
            research/semantic_invariants/embodied_atomic_repair.py \
            research/semantic_invariants/embodied_execution_domain.py

      - name: Run authority-boundary regressions
        run: |
          python -m pytest -q \
            research/semantic_invariants/tests/test_embodied_repair_verification.py \
            research/semantic_invariants/tests/test_embodied_repair_runtime.py \
            research/semantic_invariants/tests/test_embodied_repair_interactions.py \
            research/semantic_invariants/tests/test_embodied_atomic_repair.py \
            research/semantic_invariants/tests/test_embodied_execution_domain.py
