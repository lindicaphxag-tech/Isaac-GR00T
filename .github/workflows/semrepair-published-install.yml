# published-install-trigger-v1
name: Validate published SemRepair 0.3.0rc1

on:
  workflow_dispatch:
  push:
    branches:
      - semrepair-v0.3-rc1
    paths:
      - ".github/workflows/semrepair-published-install.yml"

permissions:
  contents: read

jobs:
  published-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install published wheel asset
        run: |
          python -m pip install --upgrade pip
          python -m pip install "https://github.com/lindicaphxag-tech/Isaac-GR00T/releases/download/semrepair-v0.3.0rc1/semrepair-0.3.0rc1-py3-none-any.whl"
          python - <<'PY'
          import semrepair
          assert semrepair.__version__ == "0.3.0rc1"
          print("wheel", semrepair.__version__)
          PY
          semrepair-core-theorem-check --json > /tmp/wheel-theorem.json
          semrepair-compiler-conformance --json > /tmp/wheel-conformance.json

      - name: Reinstall from immutable public Git tag
        run: |
          python -m pip uninstall -y semrepair
          python -m pip install "git+https://github.com/lindicaphxag-tech/Isaac-GR00T.git@semrepair-v0.3.0rc1#subdirectory=semrepair_validation"
          python - <<'PY'
          import semrepair
          assert semrepair.__version__ == "0.3.0rc1"
          print("tag", semrepair.__version__)
          PY
          semrepair-core-theorem-check --json > /tmp/tag-theorem.json
          semrepair-compiler-conformance --json > /tmp/tag-conformance.json