name: SemRepair composite-action self-test

on:
  push:
    branches:
      - semrepair-v0.3-rc1
    paths:
      - "semrepair_validation/action.yml"
      - "semrepair_validation/ACTION.md"
      - ".github/workflows/semrepair-action-selftest.yml"

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise composite action exactly as a consumer would
        uses: ./semrepair_validation
        with:
          model-depth: "3"
