name: SemRepair trust-boundary validation

on:
  push:
    branches:
      - "validation/semrepair-trust-boundary-v1"
  pull_request:
    branches:
      - "semrepair-v0.3-rc3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-boundary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Run repair identity, authority and interaction tests
        env:
          PYTHONPATH: semrepair_validation
        run: |
          python -m pytest -q             semrepair_validation/tests/test_embodied_repair_verification.py             semrepair_validation/tests/test_embodied_repair_runtime.py             semrepair_validation/tests/test_embodied_repair_interactions.py

      - name: Run full SemRepair public core suite
        env:
          PYTHONPATH: semrepair_validation
        run: python -m pytest -q semrepair_validation/tests
