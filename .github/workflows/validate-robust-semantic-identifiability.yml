name: Robust semantic identifiability

on:
  push:
    branches:
      - validation/robust-semantic-identifiability-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robust-identifiability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint robust semantic planner
        run: |
          ruff check             .github/validation/robust_semantic_identifiability/planner.py             .github/validation/robust_semantic_identifiability/test_planner.py             .github/validation/robust_semantic_identifiability/maniskill_claim_authority_case.py

      - name: Run robust identifiability suite
        working-directory: .github/validation/robust_semantic_identifiability
        run: python -m pytest -q test_planner.py

      - name: Re-run real claim routing
        working-directory: .github/validation/robust_semantic_identifiability
        run: python maniskill_claim_authority_case.py
