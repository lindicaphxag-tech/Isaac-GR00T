name: SemRepair v0.4 activation authority

on:
  push:
    branches:
      - "research/semrepair-v0.4-activation-authority"
    paths:
      - "semrepair_validation/research/semantic_invariants/repair_activation_authority.py"
      - "semrepair_validation/tests/test_repair_activation_authority.py"
      - "semrepair_validation/research/semantic_invariants/embodied_repair_runtime.py"
      - "semrepair_validation/research/semantic_invariants/embodied_repair_verification.py"
      - "semrepair_validation/semrepair/__init__.py"
      - "semrepair_validation/pyproject.toml"
      - "semrepair_validation/formal/SemRepairFormal.lean"
      - "semrepair_validation/formal/SemRepairFormal/**"
      - "semrepair_validation/formal/lakefile.toml"
      - "semrepair_validation/formal/lean-toolchain"
      - ".github/workflows/semrepair-v04-authority.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  authority-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone SemRepair
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e semrepair_validation
          python -m pip install pytest

      - name: Run activation-authority and compatibility tests
        run: |
          cd semrepair_validation
          python -m pytest -q \
            tests/test_repair_activation_authority.py \
            tests/test_embodied_repair_runtime.py

      - name: Build Lean authority core
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          cd semrepair_validation/formal
          lake build
          ! grep -R -nE '\\b(sorry|admit)\\b' SemRepairFormal.lean SemRepairFormal
