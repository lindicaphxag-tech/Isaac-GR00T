name: RTC focused validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "gr00t/policy/gr00t_policy.py"
      - "tests/gr00t/model/test_action_head.py"
      - "tests/gr00t/policy/test_gr00t_policy.py"
      - "tests/gr00t/policy/test_policy_service.py"
      - ".github/workflows/rtc-focused-validation.yml"
  workflow_dispatch:

jobs:
  rtc-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu             torch==2.9.0 torchvision==0.24.0
          python -m pip install             pytest pytest-timeout ruff             numpy==1.26.4             transformers==4.57.3             diffusers==0.35.1             huggingface-hub             peft==0.17.1             dm-tree             albumentations==1.4.18             opencv-python-headless             msgpack==1.1.0 msgpack-numpy==0.4.8 pyzmq==27.0.1             einops==0.8.1             omegaconf==2.3.0             datasets==3.6.0             pandas==2.2.3             lmdb==1.7.5             scipy==1.15.3             gymnasium==1.2.2             tyro==0.9.17             termcolor==3.2.0             pillow

      - name: Compile changed Python
        run: |
          python -m py_compile             gr00t/policy/gr00t_policy.py             tests/gr00t/model/test_action_head.py             tests/gr00t/policy/test_gr00t_policy.py             tests/gr00t/policy/test_policy_service.py

      - name: Lint changed Python
        run: |
          ruff check             gr00t/policy/gr00t_policy.py             tests/gr00t/model/test_action_head.py             tests/gr00t/policy/test_gr00t_policy.py             tests/gr00t/policy/test_policy_service.py
          ruff format --check             gr00t/policy/gr00t_policy.py             tests/gr00t/model/test_action_head.py             tests/gr00t/policy/test_gr00t_policy.py             tests/gr00t/policy/test_policy_service.py

      - name: Run focused RTC regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q             tests/gr00t/model/test_action_head.py             tests/gr00t/policy/test_gr00t_policy.py             tests/gr00t/policy/test_policy_service.py
